name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Tipos, lint, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run test:db
      - run: bun run api:typecheck
      - run: bun run api:test
      - run: bun run build
        env:
          VITE_SUPABASE_URL: http://localhost:8000
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder

  docker:
    name: Imagens Docker
    runs-on: ubuntu-latest
    needs: verificar
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          build-args: |
            VITE_SUPABASE_URL=http://localhost:8000
            VITE_SUPABASE_PUBLISHABLE_KEY=ci-placeholder
      - name: Build api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: false
      - name: Build migrator
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: false
      - name: Validar config do Kong (renderizada como no container)
        run: |
          SUPABASE_ANON_KEY=a SUPABASE_SERVICE_KEY=b bash -c 'eval "echo \"$(cat infra/kong/kong.yml)\""' > /tmp/kong.yml
          python3 -c "import yaml,sys; d=yaml.safe_load(open('/tmp/kong.yml')); sys.exit(0 if isinstance(d['_format_version'], str) else 'kong.yml: _format_version virou número (aspas duplas?)')"
      - name: Validar docker-compose
        working-directory: infra
        run: cp .env.example .env && docker compose config --quiet
